<div class="min-h-screen bg-[#f8fafc] flex flex-col justify-center items-center p-4 font-sans">

  <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 w-130  overflow-hidden border border-slate-100 relative">

    <div class="p-6 pb-0">
      <button class="w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-[#0f766e]"
              (click)="router.navigate(['/verif-email'])"
              aria-label="Go back">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </div>

    <div class="p-8 pt-4 flex flex-col items-center text-center">

      <div class="w-16 h-16 bg-teal-50 rounded-2xl border border-teal-100 flex items-center justify-center mb-6 text-[#0f766e] text-2xl shadow-inner">
        <i class="fa-regular fa-envelope-open"></i>
      </div>

      <h1 class="font-black text-2xl md:text-3xl text-slate-900 mb-3 tracking-tight">
        Confirm your account
      </h1>
      <p class="text-slate-500 text-[15px] leading-relaxed mb-8 px-2">
        We sent a verification code to your email. Enter the 6-digit code below to confirm your account.
      </p>

      <div *ngIf="notifMsg"
           class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm font-semibold px-4 py-3 rounded-xl mb-6 flex items-center justify-center gap-2"
           role="alert">
        <i class="fa-solid fa-circle-info text-[#0f766e]"></i>
        <span>{{ notifMsg }}</span>
      </div>
<form #verifyCodeForm="ngForm" (ngSubmit)="onSubmit(verifyCodeForm)">
      <div class="w-full mb-8">
        <input #codeEmail="ngModel"
          [(ngModel)]="changePasswordRequest.codeEmail"
               class="w-full text-center text-3xl font-black tracking-[0.5em] text-slate-800 placeholder:text-slate-300 placeholder:tracking-normal placeholder:font-medium border-2 border-slate-200 bg-slate-50 p-4 rounded-2xl focus:bg-white focus:border-[#0f766e] focus:ring-4 focus:ring-[#0f766e]/10 outline-none transition-all"
               type="text"
               name="codeEmail"
               required
               inputmode="numeric"
               pattern="[0-9]*"
               maxlength="6"
               placeholder="------"
               aria-label="6-digit verification code">
        <span *ngIf="codeEmail.invalid && codeEmail.touched"
              class="text-[11px] text-red-500 font-semibold flex items-center gap-1">

          <span *ngIf="codeEmail.errors?.['pattern']"> <i class="fa-solid fa-circle-exclamation text-[10px]"></i>Numbers Only</span>
        </span>
      </div>

      <div class="w-full flex flex-col gap-3">
        <button [disabled]="verifyCodeForm.invalid" class="w-full bg-[#0f766e] hover:bg-[#0d6460] text-white font-bold text-base py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-teal-900/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0f766e] flex items-center justify-center gap-2 disabled:cursor-not-allowed disabled:opacity-30"
                type="submit">
          Verify and Continue
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>


        <button class="w-full text-[#0f766e] font-bold text-[15px] py-3.5 rounded-xl hover:bg-teal-50 transition-colors focus:outline-none focus:ring-2 focus:ring-[#0f766e] focus:ring-inset"
                (click)="resendCode()"
                type="button">
          Didn't get a code?
        </button>
      </div>
</form>

    </div>
  </div>
</div>
