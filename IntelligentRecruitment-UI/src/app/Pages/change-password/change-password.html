<div class="min-h-screen bg-[#f8fafc] flex flex-col justify-center items-center p-4 font-sans">

  <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 w-140  overflow-hidden border border-slate-100 relative">

    <div class="p-6 pb-0">
      <button class="w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0f766e]"
              routerLink="/verif-code"
              aria-label="Go back to verification code">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      </button>
    </div>

    <div class="p-8 pt-4 flex flex-col text-center">

      <div class="w-16 h-16 bg-teal-50 rounded-2xl border border-teal-100 flex items-center justify-center mx-auto mb-6 text-[#0f766e] text-2xl shadow-inner">
        <i class="fa-solid fa-lock" aria-hidden="true"></i>
      </div>

      <h1 class="font-black text-2xl md:text-3xl text-slate-900 mb-3 tracking-tight">
        Secure your account
      </h1>
      <p class="text-slate-500 text-[14px] leading-relaxed mb-8 px-2">
        Almost there! Enter a new, strong password to regain access to your account.
      </p>

      <form #changePasswordForm="ngForm" (ngSubmit)="onSubmit(changePasswordForm)">
      <div class="flex flex-col gap-5 mb-8 text-left">

        <div class="flex flex-col gap-1.5">
          <label for="newPassword" class="text-sm font-bold text-slate-700 ml-1">New Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-key text-slate-400" aria-hidden="true"></i>
            </div>

            <input id="newPassword"
                   class="w-full border-2 border-slate-200 bg-slate-50 p-3.5 pl-11 rounded-xl focus:bg-white focus:border-[#0f766e] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0f766e]/20 text-sm transition-all text-slate-900 font-medium placeholder:text-slate-400 placeholder:font-normal"
                   [(ngModel)]="changePasswordRequest.newPassword"
                   #newPassword="ngModel"
                   name="newPassword"
                   required
                   minlength="8"
                   type="password"
                   placeholder="Enter a new password">
            <div *ngIf="newPassword.touched && newPassword.invalid " class="text-red-500 text-xs pl-1">
              <span class="font-bold" *ngIf="newPassword.errors?.['required']">*Required</span>
              <span class="font-bold" *ngIf="!newPassword.errors?.['required'] && newPassword.errors?.['minlength'] ">
      *Min 8 character
    </span>

            </div>
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="confirmPassword" class="text-sm font-bold text-slate-700 ml-1">Confirm Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-shield-check text-slate-400" aria-hidden="true"></i>
            </div>
            <input id="confirmPassword"
                   class="w-full border-2 border-slate-200 bg-slate-50 p-3.5 pl-11 rounded-xl focus:bg-white focus:border-[#0f766e] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0f766e]/20 text-sm transition-all text-slate-900 font-medium placeholder:text-slate-400 placeholder:font-normal"
                   [(ngModel)]="confirmPassword"
                   #ConfirmPassword="ngModel"
                   required
                   minlength="8"
                   name="confirmPassword"
                   type="password"
                   placeholder="Retype new password">
            <div *ngIf="ConfirmPassword.touched && (ConfirmPassword.invalid || changePasswordRequest.newPassword !== confirmPassword)" class="text-red-500 text-xs pl-1">
              <span class="font-bold" *ngIf="ConfirmPassword.errors?.['required']">*Required</span>
              <span class="font-bold" *ngIf="!ConfirmPassword.errors?.['required'] && !ConfirmPassword.errors?.['minlength'] && changePasswordRequest.newPassword !== confirmPassword">
      *Passwords do not match
    </span>

            </div>
          </div>
        </div>

      </div>

      <button [disabled]="changePasswordForm.invalid" class="w-full bg-[#0f766e] hover:bg-[#0d6460] text-white font-bold text-base py-4 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-teal-900/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#0f766e] flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
              type="submit">
        Change Password

      </button>
      </form>

    </div>
  </div>
</div>
