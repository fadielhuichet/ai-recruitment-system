<main class="min-h-screen bg-[#f8fafc] flex flex-col justify-center items-center p-4 font-sans text-slate-800">

  <div class="w-130  bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">

    <div class="p-6 pb-0 flex justify-start">
      <button routerLink="/login"
              class="w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0f766e]"
              aria-label="Back to Login">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </div>

    <div class="p-8 pt-2">

      <div class="text-center mb-8">


        <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">
          Reset Password
        </h1>
        <p class="mt-3 text-[15px] text-slate-600 leading-relaxed">
          Don't worry. Enter your email address below and we'll send you instructions to reset your password.
        </p>
      </div>

      <div *ngIf="errorMsg"
           role="alert"
           class="mb-6 flex items-center gap-3 bg-red-50 border border-red-200 p-4 rounded-xl text-red-800 text-sm font-semibold">
        <i class="fa-solid fa-circle-exclamation text-red-500"></i>
        <span>{{errorMsg}}</span>
      </div>

      <form #verifEmailForm="ngForm" (ngSubmit)="onSubmit(verifEmailForm)" class="space-y-6">

        <div class="flex flex-col gap-1.5">
          <label for="email-address" class="text-sm font-bold text-slate-700 ml-1">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-regular fa-envelope text-slate-400" aria-hidden="true"></i>
            </div>
            <input
              [(ngModel)]="changePasswordRequest.email"
              type="email"
              id="email-address"
              name="email"
              #emailForm="ngModel"
              email
              required
              class="block w-full rounded-xl border-2 border-slate-200 bg-slate-50 px-4 py-3.5 pl-11 text-slate-900
                     placeholder-slate-400 focus:bg-white focus:border-[#0f766e] focus:outline-none focus-visible:ring-4
                     focus-visible:ring-[#0f766e]/10 transition-all text-sm font-medium"
              placeholder="name@example.com">
          </div>

          <div *ngIf="emailForm.touched && emailForm.invalid" class="flex items-center gap-1.5 mt-1 ml-1 text-red-600">
            <i class="fa-solid fa-circle-info text-[10px]"></i>
            <span class="text-xs font-bold" *ngIf="emailForm.errors?.['required']">Email is required</span>
            <span class="text-xs font-bold" *ngIf="emailForm.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <button
          [disabled]="verifEmailForm.invalid ||isLoading"
          type="submit"
          class="w-full flex justify-center items-center gap-2 rounded-xl bg-[#0f766e] px-4 py-4 text-base font-bold text-white
                 hover:bg-[#0d6460] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0f766e] focus-visible:ring-offset-2
                 transition-all active:scale-[0.98] shadow-lg shadow-teal-900/20 disabled:opacity-50 disabled:cursor-not-allowed
                 disabled:active:scale-100 border-none cursor-pointer">
          {{ isLoading ? 'Sending...' : 'SEND' }}
          <i class="fa-solid fa-paper-plane text-xs opacity-80" aria-hidden="true"></i>
        </button>
      </form>

      <div class="mt-8 text-center">
        <a routerLink="/login"
           class="text-sm font-bold text-[#0f766e] hover:text-[#0d6460] underline-offset-4 hover:underline transition-all">
          Back to login
        </a>
      </div>

    </div>
  </div>
</main>
