<app-header></app-header>

<div class="flex min-h-[calc(100vh-5rem)] justify-center py-10 px-4 bg-gray-50">

  <div class="w-full max-w-[900px]">

    <div class="flex gap-5 items-start">

      <aside class="w-[220px] shrink-0 bg-white rounded-[16px] overflow-hidden sticky top-6"
             style="border:0.5px solid rgba(0,0,0,.08); box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 4px 20px rgba(15,118,110,.07)">

        <div class="flex flex-col items-center text-center px-4 py-5 border-b border-gray-100">
          <div class="w-14 h-14 rounded-full flex items-center justify-center text-[1.1rem]
                      font-semibold text-[#0f766e] mb-3 shrink-0"
               style="background:#f0fdfa; border:2px solid #ccfbf1">
            {{ initials }}
          </div>
          <p class="text-[.88rem] font-semibold text-gray-900 leading-tight">
            {{ admin.username }}
          </p>
          <p class="text-[.72rem] text-gray-400 mt-1 break-all">{{ admin.email }}</p>
          <span class="inline-flex items-center gap-1 text-[.7rem] font-medium text-[#0f6e56]
                       rounded-full px-2.5 py-0.5 mt-2.5"
                style="background:#E1F5EE">
            <i class="fa-solid fa-shield-halved text-[9px]"></i>
            Admin
          </span>
        </div>

        <nav class="py-2">
          <button type="button"
                  (click)="activeSection = 'info'"
                  [ngClass]="activeSection === 'info'
                    ? 'text-[#0f766e] bg-[#f0fdfa] font-semibold'
                    : 'text-gray-500 hover:bg-gray-50'"
                  class="w-full flex items-center gap-2.5 px-4 py-2.5 text-[.82rem]
                         transition-colors text-left border-none bg-transparent cursor-pointer">
            <i class="fa-regular fa-user text-[13px]"></i>
            Personal info
          </button>

          <button type="button"
                  (click)="activeSection = 'security'"
                  [ngClass]="activeSection === 'security'
                    ? 'text-[#0f766e] bg-[#f0fdfa] font-semibold'
                    : 'text-gray-500 hover:bg-gray-50'"
                  class="w-full flex items-center gap-2.5 px-4 py-2.5 text-[.82rem]
                         transition-colors text-left border-none bg-transparent cursor-pointer">
            <i class="fa-solid fa-lock text-[13px]"></i>
            Security
          </button>
        </nav>
      </aside>

      <div class="flex-1 flex flex-col gap-4 min-w-0">

        <div *ngIf="successMsg"
             class="flex items-center gap-2.5 rounded-[10px] px-4 py-3
                    bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-medium">
          <i class="fa-solid fa-circle-check text-emerald-500"></i>
          {{ successMsg }}
        </div>

        <div *ngIf="activeSection === 'info'"
             class="bg-white rounded-[16px]"
             style="border:0.5px solid rgba(0,0,0,.08); box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 4px 20px rgba(15,118,110,.07)">

          <div class="flex items-center gap-2 px-5 py-3.5 border-b border-gray-100">
            <i class="fa-regular fa-user text-[#0f766e] text-sm"></i>
            <span class="text-[.72rem] font-semibold uppercase tracking-[.08em] text-[#0f766e]">Personal Information</span>
          </div>

          <form #infoForm="ngForm" (ngSubmit)="onSaveInfo(infoForm)" novalidate class="p-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

              <div class="flex flex-col gap-1.5">
                <label class="text-[.78rem] font-medium text-gray-500">First name</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-regular fa-user text-[12px]"></i>
                  </span>
                  <input name="firstName" ngModel required #firstName="ngModel"
                         [(ngModel)]="admin.username" type="text" placeholder="First name"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{'border-red-400': firstName.touched && firstName.invalid,
                                'border-emerald-400': firstName.touched && firstName.valid,
                                'border-gray-200': !firstName.touched}" />
                </div>
                <span *ngIf="firstName.touched && firstName.invalid" class="text-red-500 text-[.72rem]">*Required</span>
              </div>


              <div class="flex flex-col gap-1.5 sm:col-span-2">
                <label class="text-[.78rem] font-medium text-gray-500">Email address</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-regular fa-envelope text-[12px]"></i>
                  </span>
                  <input name="email" ngModel required email #email="ngModel"
                         [(ngModel)]="admin.email" type="email" placeholder="you@example.com"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{'border-red-400': email.touched && email.invalid,
                                'border-emerald-400': email.touched && email.valid,
                                'border-gray-200': !email.touched}" />
                </div>
                <div *ngIf="email.touched && email.invalid" class="text-red-500 text-[.72rem]">
                  <span *ngIf="email.errors?.['required']">*Required</span>
                  <span *ngIf="email.errors?.['email']">*Invalid email format</span>
                </div>
              </div>

              <div class="flex flex-col gap-1.5">
                <label class="text-[.78rem] font-medium text-gray-500">Phone number</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-solid fa-phone text-[12px]"></i>
                  </span>
                  <input name="phone" ngModel required pattern="^[0-9+ ]{8,15}$" #phone="ngModel"
                         [(ngModel)]="admin.phone" type="tel" placeholder="+1 555 000 0000"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{'border-red-400': phone.touched && phone.invalid,
                                'border-emerald-400': phone.touched && phone.valid,
                                'border-gray-200': !phone.touched}" />
                </div>
                <div *ngIf="phone.touched && phone.invalid" class="text-red-500 text-[.72rem]">
                  <span *ngIf="phone.errors?.['required']">*Required</span>
                  <span *ngIf="phone.errors?.['pattern']">*Invalid phone number</span>
                </div>
              </div>
            </div>

            <div class="flex justify-end gap-2.5 mt-5 pt-4 border-t border-gray-100">
              <button type="button" (click)="resetInfo()"
                      class="px-4 py-2 rounded-[8px] border border-gray-200 text-sm text-gray-500
                             hover:bg-gray-50 transition-colors bg-transparent cursor-pointer">Cancel</button>
              <button type="submit" [disabled]="infoForm.invalid || savingInfo"
                      class="px-5 py-2 rounded-[8px] bg-[#0f766e] text-sm font-semibold text-white
                             hover:bg-[#0c5c56] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!savingInfo">Save changes</span>
                <span *ngIf="savingInfo"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Saving…</span>
              </button>
            </div>
          </form>
        </div>

        <div *ngIf="activeSection === 'security'"
             class="bg-white rounded-[16px]"
             style="border:0.5px solid rgba(0,0,0,.08); box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 4px 20px rgba(15,118,110,.07)">

          <div class="flex items-center gap-2 px-5 py-3.5 border-b border-gray-100">
            <i class="fa-solid fa-lock text-[#0f766e] text-sm"></i>
            <span class="text-[.72rem] font-semibold uppercase tracking-[.08em] text-[#0f766e]">Security</span>
          </div>

          <form #pwForm="ngForm" (ngSubmit)="onChangePassword(pwForm)" novalidate class="p-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

              <div class="flex flex-col gap-1.5 sm:col-span-2">
                <label class="text-[.78rem] font-medium text-gray-500">Current password</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-solid fa-lock text-[12px]"></i>
                  </span>
                  <input name="currentPassword" ngModel required #currentPassword="ngModel"
                         [(ngModel)]="passwordForm.current" type="password" placeholder="••••••••"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{'border-red-400': currentPassword.touched && currentPassword.invalid,
                                'border-gray-200': !currentPassword.touched || currentPassword.valid}" />
                </div>
                <span *ngIf="currentPassword.touched && currentPassword.invalid" class="text-red-500 text-[.72rem]">*Required</span>
              </div>

              <div class="flex flex-col gap-1.5">
                <label class="text-[.78rem] font-medium text-gray-500">New password</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-solid fa-lock text-[12px]"></i>
                  </span>
                  <input name="newPassword" ngModel required minlength="8" #newPassword="ngModel"
                         [(ngModel)]="passwordForm.newPass" type="password" placeholder="Min. 8 characters"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{'border-red-400': newPassword.touched && newPassword.invalid,
                                'border-emerald-400': newPassword.touched && newPassword.valid,
                                'border-gray-200': !newPassword.touched}" />
                </div>
                <div *ngIf="newPassword.touched && newPassword.invalid" class="text-red-500 text-[.72rem]">
                  <span *ngIf="newPassword.errors?.['required']">*Required</span>
                  <span *ngIf="newPassword.errors?.['minlength']">*Min. 8 characters</span>
                </div>
              </div>

              <div class="flex flex-col gap-1.5">
                <label class="text-[.78rem] font-medium text-gray-500">Confirm new password</label>
                <div class="relative">
                  <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <i class="fa-solid fa-lock text-[12px]"></i>
                  </span>
                  <input name="confirmNewPassword" ngModel required minlength="8"
                         #confirmNewPw="ngModel" [(ngModel)]="passwordForm.confirm"
                         type="password" placeholder="Repeat password"
                         class="w-full rounded-[8px] border pl-8 pr-3 py-[.55rem] text-sm outline-none transition-all
                           focus:border-[#0f766e] focus:ring-2 focus:ring-[#0f766e]/20"
                         [ngClass]="{
                      'border-red-400': confirmNewPw.touched && (confirmNewPw.invalid || passwordForm.newPass !== passwordForm.confirm),
                      'border-emerald-400': confirmNewPw.touched && confirmNewPw.valid && passwordForm.newPass === passwordForm.confirm,
                      'border-gray-200': !confirmNewPw.touched
                    }" />
                </div>
                <div *ngIf="confirmNewPw.touched && (confirmNewPw.invalid || passwordForm.newPass !== passwordForm.confirm)"
                     class="text-red-500 text-[.72rem]">
                  <span *ngIf="confirmNewPw.errors?.['required']">*Required</span>
                  <span *ngIf="!confirmNewPw.errors?.['required'] && passwordForm.newPass !== passwordForm.confirm">
                    *Passwords do not match
                  </span>
                </div>
              </div>

              <div *ngIf="passwordError" class="sm:col-span-2">
                <span class="text-red-500 text-[.78rem]">{{ passwordError }}</span>
              </div>

            </div>

            <div class="flex justify-end gap-2.5 mt-5 pt-4 border-t border-gray-100">
              <button type="button" (click)="resetPassword()"
                      class="px-4 py-2 rounded-[8px] border border-gray-200 text-sm text-gray-500
                             hover:bg-gray-50 transition-colors bg-transparent cursor-pointer">Cancel</button>
              <button type="submit"
                      [disabled]="pwForm.invalid || passwordForm.newPass !== passwordForm.confirm || savingPassword"
                      class="px-5 py-2 rounded-[8px] bg-[#0f766e] text-sm font-semibold text-white
                             hover:bg-[#0c5c56] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!savingPassword">Update password</span>
                <span *ngIf="savingPassword"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Updating…</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
